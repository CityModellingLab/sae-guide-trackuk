project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "pages/*.qmd"
  
website:
  title: "Small Area Estimation for Urban Analytics"
  favicon: assets/favicon.svg
  page-navigation: true
  navbar:
    background: "#1f4e5f"
    foreground: "#ffffff"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Tutorial"
        menu:
          - text: "Survey microdata prep"
            href: pages/dataprep-microdata.qmd
          - text: "Direct estimation"
            href: pages/direct-estimation.qmd
          - text: "Area-level estimation (Fay--Herriot)"
            href: pages/fh-bayesian.qmd
          - text: "Unit-level estimation"
            href: pages/unit-level-bayesian.qmd
          - text: "MRP"
            href: pages/mrp-bayesian.qmd
      - text: "Resources"
        href: pages/resources.qmd
      - text: "About"
        href: pages/about.qmd


  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Home"
        contents:
          - index.qmd
      - section: "Tutorial"
        contents:
          - text: "Survey microdata prep"
            href: pages/dataprep-microdata.qmd
          - text: "Direct estimation"
            href: pages/direct-estimation.qmd
          - text: "Area-level estimation"
            href: pages/fh-bayesian.qmd
          - text: "Unit-level estimation"
            href: pages/unit-level-bayesian.qmd
          - text: "MRP"
            href: pages/mrp-bayesian.qmd
          

format:
  html:
    theme: cosmo
    css: styles.css
    df-print: kable
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-fold: true
    code-overflow: wrap
    link-external-newwindow: true
    fig-cap-location: bottom

execute:
  eval: true
  warning: false
  message: false
  freeze: false

editor:
  render-on-save: false
