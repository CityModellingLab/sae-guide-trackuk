project:
  type: website
  output-dir: docs
  resources:
    - "toolkit-scripts/*.R"
  render:
    - index.qmd
    - dataprep.qmd
    - direct-estimation.qmd
    - fh-area.qmd
    - bhf-unit.qmd
    - mrp-rich.qmd
    - diagnostics.qmd
    - toolkit.qmd
  
website:
  title: "Small Area Estimation for Urban Analytics"
  favicon: assets/favicon.svg
  page-navigation: true
  navbar:
    logo: assets/favicon.svg
    background: "#1f4e5f"
    foreground: "#ffffff"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Tutorial"
        menu:
          - text: "Setting up"
            href: dataprep.qmd
          - text: "Direct estimation"
            href: direct-estimation.qmd
          - text: "Area-level SAE"
            href: fh-area.qmd
          - text: "Unit-level SAE"
            href: bhf-unit.qmd
          - text: "Unit-level SAE with Poststrat"
            href: mrp-rich.qmd
          - text: "Diagnostics"
            href: diagnostics.qmd
      - text: "Resources"
        menu:
          - text: "Toolkit"
            href: toolkit.qmd


  sidebar:
    style: "docked"
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Tutorial"
        contents:
          - text: "Setting up"
            href: dataprep.qmd
          - text: "Direct estimation"
            href: direct-estimation.qmd
          - text: "Area-level SAE"
            href: fh-area.qmd
          - text: "Unit-level SAE"
            href: bhf-unit.qmd
          - text: "Unit-level SAE with Poststrat"
            href: mrp-rich.qmd
          - text: "Diagnostics"
            href: diagnostics.qmd
      - section: "Resources"
        contents:
          - text: "Toolkit"
            href: toolkit.qmd
          

format:
  html:
    theme: cosmo
    css: styles.css
    df-print: kable
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: katex
    code-copy: true
    code-fold: true
    code-overflow: wrap
    link-external-newwindow: true
    fig-cap-location: bottom

execute:
  eval: true
  warning: false
  message: false
  freeze: false

editor:
  render-on-save: false
