project:
  type: website
  output-dir: docs
  resources:
    - "toolkit-scripts/*.R"
  render:
    - "*.qmd"
  
website:
  title: "Small Area Estimation for Urban Analytics"
  favicon: assets/favicon.svg
  page-navigation: true
  navbar:
    logo: assets/favicon.svg
    background: "#1f4e5f"
    foreground: "#ffffff"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Tutorial"
        menu:
          - text: "Setting up"
            href: dataprep.qmd
          - text: "Direct estimation"
            href: direct-estimation.qmd
          - text: "Area-level (FH)"
            href: fh-area.qmd
          - text: "Unit-level (BHF)"
            href: bhf-unit.qmd
          - text: "SAE with Poststrat (MRP)"
            href: mrp-rich.qmd
          - text: "SAE with Poststrat (MRP)"
            href: mrp-context.qmd
      - text: "Resources"
        menu:
          - text: "Toolkit"
            href: toolkit.qmd
          - text: "Bibliography"
            href: bibliography.qmd


  sidebar:
    style: "docked"
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Tutorial"
        contents:
          - text: "Setting up"
            href: dataprep.qmd
          - text: "Direct estimation"
            href: direct-estimation.qmd
          - text: "Area-level (FH)"
            href: fh-area.qmd
          - text: "Unit-level (BHF)"
            href: bhf-unit.qmd
          - text: "SAE with Poststrat (MRP)"
            href: mrp-rich.qmd
          - text: "SAE with Poststrat (MRP)"
            href: mrp-context.qmd
      - section: "Resources"
        contents:
          - text: "Toolkit"
            href: toolkit.qmd
          - text: "Bibliography"
            href: bibliography.qmd
          

format:
  html:
    theme: cosmo
    css: styles.css
    df-print: kable
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: katex
    code-copy: true
    code-fold: true
    code-overflow: wrap
    link-external-newwindow: true
    fig-cap-location: bottom

execute:
  eval: true
  warning: false
  message: false
  freeze: false

editor:
  render-on-save: false
