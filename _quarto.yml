project:
  type: website
  output-dir: docs
  resources:
    - "scripts/"
  render:
    - "index.qmd"
    - "pages/*.qmd"
  
website:
  title: "Small Area Estimation for Urban Analytics"
  favicon: assets/favicon.svg
  page-navigation: true
  navbar:
    background: "#1f4e5f"
    foreground: "#ffffff"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Tutorial"
        menu:
          - text: "I. Data Preparation"
          - text: "1. Survey microdata"
            href: pages/dataprep-microdata.qmd
          - text: "2. Auxiliary data"
            href: pages/dataprep-auxdata.qmd
          - text: "II. Area-Level Estimation"
          - text: "1. Overview"
            href: pages/area-level-sae.qmd
          - text: "2. Direct Estimation"
            href: pages/area-level-direct.qmd
          - text: "3. Bayesian Fay-Herriot"
            href: pages/area-level-fh-bayesian.qmd
          - text: "III. Unit-Level Estimation"
          - text: "1. Overview"
            href: pages/unit-level-sae.qmd
          - text: "2. MRP with Population Cells"
            href: pages/unit-level-popcell.qmd
          - text: "3. Bayesian Microdata Prediction"
            href: pages/unit-level-popunit.qmd
          - text: "IV. Extended Topics"
          - text: "1. Reporting and visualisation"
            href: pages/reporting.qmd
          - text: "2. Frequentist approaches to SAE"
            href: pages/frequentist-sae.qmd
      - text: "Resources"
        menu:
          - text: "SAE Toolkit"
            href: pages/sae-toolkit.qmd
          - text: "FAQs"
            href: pages/faqs.qmd
      - text: "About"
        href: pages/about.qmd


  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Home"
        contents:
          - index.qmd
      - section: "Tutorial"
        contents:
          - section: "I. Data Preparation"
            contents:
              - pages/dataprep-microdata.qmd
              - pages/dataprep-auxdata.qmd
          - section: "II. Area-Level Estimation"
            contents:
              - pages/area-level-sae.qmd
              - pages/area-level-direct.qmd
              - pages/area-level-fh-bayesian.qmd
          - section: "III. Unit-Level Estimation"
            contents:
              - pages/unit-level-sae.qmd
              - pages/unit-level-popcell.qmd
              - pages/unit-level-popunit.qmd
          - section: "IV. Extended Topics"
            contents:
              - pages/reporting.qmd
              - pages/frequentist-sae.qmd

      - section: "Resources"
        contents:
          - pages/sae-toolkit.qmd
          - pages/faqs.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    df-print: kable
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-fold: true
    code-overflow: wrap
    link-external-newwindow: true
    fig-cap-location: bottom

execute:
  eval: true
  warning: false
  message: false
  freeze: false

editor:
  render-on-save: false
